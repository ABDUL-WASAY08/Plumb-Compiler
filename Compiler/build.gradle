plugins {
    id 'java'
    id 'application'
}

group = 'com.plumb'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'de.jflex:jflex:1.9.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


def generatedLexerDir = layout.buildDirectory.dir('generated/jflex/java')


tasks.register('generateLexer', JavaExec) {
    group = 'build'
    description = 'Generates PlumbLexer.java from src/main/Jflex/plumb.jflex'

    inputs.file('src/main/Jflex/plumb.jflex')
    outputs.dir(generatedLexerDir)

    classpath = configurations.runtimeClasspath
    mainClass = 'jflex.Main'
    args = ['-d', generatedLexerDir.get().asFile.absolutePath, 'src/main/Jflex/plumb.jflex']

    doFirst {
        generatedLexerDir.get().asFile.mkdirs()
    }
}


sourceSets {
    main {
        java {
            srcDir generatedLexerDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateLexer'
}

tasks.register('copyLibs', Copy) {
    group = 'build'
    description = 'Copies dependency jars into lib/ for manual commands'
    from configurations.runtimeClasspath
    into layout.projectDirectory.dir('lib')
}


application {
    mainClass = 'LexerRunner'
}
